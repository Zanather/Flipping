<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}D2R Inventory Assistant{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand d2r-brand" href="/">
                <i class="bi bi-gem"></i> D2R Assistant
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-backpack"></i> Inventory
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/analyzer' %}active{% endif %}" href="/analyzer">
                            <i class="bi bi-search"></i> Analyzer
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/prices' %}active{% endif %}" href="/prices">
                            <i class="bi bi-currency-exchange"></i> Prices
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/trade' %}active{% endif %}" href="/trade">
                            <i class="bi bi-shop"></i> Trade
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/guides' %}active{% endif %}" href="/guides">
                            <i class="bi bi-book"></i> Guides
                        </a>
                    </li>
                </ul>
                <div class="ms-auto">
                    <form class="d-flex" id="globalSearch" onsubmit="globalSearch(event)">
                        <input class="form-control form-control-sm me-2" type="search" id="globalSearchInput"
                               placeholder="Search items..." aria-label="Search">
                        <button class="btn btn-outline-warning btn-sm" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-3">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-3 border-top border-secondary mt-4">
        <small>D2R Inventory Assistant v1.0 | Not affiliated with Blizzard Entertainment</small>
    </footer>

    <!-- Global Search Results Modal -->
    <div class="modal fade" id="searchModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Search Results</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="searchResults">
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
